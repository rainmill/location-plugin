[package]
name = "rainmill-location"
version = "0.1.0"
description = "Rainmill Location: a portable curated place tree with aliases and resolution, for Laterite"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rainmill/location-plugin"

# Marks this crate as a Laterite plugin and names the module it registers, so a
# tool can tell what it is without building it. Which Laterite it supports is
# stated by the dependency requirement below, never repeated here.
[package.metadata.laterite]
plugin = "rainmill.location"

[dependencies]
# Laterite crates are version-only so this manifest is location-independent
# (identical whether dev-symlinked under an app's plugins/ tree or vendored).
# Laterite is unpublished, so the workspace that builds this plugin resolves these
# to the local checkout through its root [patch.crates-io] (see the app Cargo.toml);
# that patch vanishes once Laterite ships. Build/test this crate via that workspace
# (`cargo test -p rainmill-location`) until Laterite publishes.
laterite-core = "0.6"
# The admin descriptors (list/form screens) the module contributes from its
# `register`. The place tree is the plugin's headless core; the admin screens are
# its curation surface, rendered by the framework's generic handlers.
laterite-admin = "0.6"
# The schema identifier enums use sea-query's `Iden` derive, whose generated code
# references the `sea_query` crate directly. The framework re-exports the types
# through `strata`, but the derive still needs the crate as a direct dependency.
sea-query = { version = "0.32", features = ["derive"] }
# Query execution goes through sqlx's portable `Any` layer, matching the framework.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "any"] }
# Text timestamps (the framework stores times as ISO strings).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Alias normalization and slugs: use well-maintained crates, not hand-rolled string
# munging. `deunicode` folds accents (Bengaluru/Bengalūru), `slug` makes URL slugs.
deunicode = "1"
slug = "0.1"

[dev-dependencies]
# Tests run migrations against a real backend through the framework harness
# (SQLite in-memory by default), so enable a driver and the test harness.
laterite-core = { version = "0.6", features = ["sqlite", "postgres", "testing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
