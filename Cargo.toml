[package]
name = "rainmill-location"
version = "0.1.0"
description = "Rainmill Location: a portable curated place tree with aliases and resolution, for Laterite"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lateritecmf/rainmill-location"

[dependencies]
# Laterite is unpublished and consumed by path in development (a Laterite
# checkout sits beside this repo); the version is emitted when publishing.
laterite-core = { path = "../laterite/crates/core", version = "0.2" }
# The schema identifier enums use sea-query's `Iden` derive, whose generated code
# references the `sea_query` crate directly. The framework re-exports the types
# through `strata`, but the derive still needs the crate as a direct dependency.
sea-query = { version = "0.32", features = ["derive"] }
# Query execution goes through sqlx's portable `Any` layer, matching the framework.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "any"] }
# Text timestamps (the framework stores times as ISO strings).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Alias normalization and slugs: use well-maintained crates, not hand-rolled string
# munging. `deunicode` folds accents (Bengaluru/Bengalūru), `slug` makes URL slugs.
deunicode = "1"
slug = "0.1"

[dev-dependencies]
# Tests run migrations against a real backend through the framework harness
# (SQLite in-memory by default), so enable a driver and the test harness.
laterite-core = { path = "../laterite/crates/core", features = ["sqlite", "postgres", "testing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
