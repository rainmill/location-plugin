# The Locations screen: the place tree as a list, the create/edit form, and a
# node's children on its own edit page. The write handler and the picker the
# file names are registered in Rust (`rainmill.location.node`).
entity: rainmill_location_node
path: /locations
title: Locations
permission: rainmill.location.manage
# Places change rarely, so the screen is listed in Settings. An application
# moves it back with a menu move in its configuration.
menu:
  icon: map-pin
  in_settings: System
  description: Countries, regions and cities, and the hierarchy records are placed in.
palette: rainmill.location.node
import: true
list: &list
  order_by: canonical_name
  creatable: true
  tree: { parent_key: parent_id, source: rainmill.location.node }
  columns:
    canonical_name: { label: Name }
    level:          {}
    slug:           {}
    status:         {}
    created_at:     { label: Created, type: datetime }
form: &form
  title: Location
  panels:
    - { title: Features, src: "rainmill/location/features/{id}" }
  persist: rainmill.location.node
  fields:
    canonical_name: { label: Name, rules: [required] }
    slug:           { rules: [required, unique] }
    level:          { rules: [required] }
    parent_id:      { type: reference, label: Parent, source: rainmill.location.node }
    timezone:       {}
    currency_code:  { label: Currency }
    locale:         {}
relations:
  aliases:
    title: Also known as
    label: Name
    entity: rainmill_location_alias
    foreign_key: node_id
    list:
      order_by: alias
      creatable: true
      deletable: true
      columns:
        alias:       { label: Name }
        lang:        { label: Language }
        is_official: { label: Official, type: boolean }
    form:
      title: Other name
      fields:
        alias:
          label: Name
          rules: [required]
          help: Another name people search this place by, such as a former or a local name.
        lang: { label: Language, help: "A language tag such as en or kn. Leave empty when it is not specific to one." }
        is_official: { type: switch, label: Official name }
  children:
    title: Child locations
    label: Child location
    entity: rainmill_location_node
    foreign_key: parent_id
    list: *list
    form: *form
