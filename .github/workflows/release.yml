name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

# A pushed `vX.Y.Z` tag is a release. The tag must equal the crate version and
# have a CHANGELOG section, and the tests pass against the published framework.
# crates.io is published through Trusted Publishing (environment `release`); a
# version already on crates.io, such as a first version published by hand, is
# left alone. The GitHub release is then created from the CHANGELOG section,
# marked pre-release when the tag carries a suffix. A tag whose GitHub release
# exists ends at `gate`.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - name: Is this tag already released?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$GITHUB_REF_NAME is already released; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: The tag must equal the crate version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "rainmill-location") | .version')"
          if [ "$version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "tag $GITHUB_REF_NAME does not match rainmill-location $version"
            exit 1
          fi
      - name: The CHANGELOG must have a section for this version
        run: grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md
      - run: cargo test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Is this version already on crates.io?
        id: held
        run: |
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'User-Agent: rainmill-release (github.com/${{ github.repository }})' \
            "https://crates.io/api/v1/crates/rainmill-location/${GITHUB_REF_NAME#v}")"
          if [ "$code" = "200" ]; then
            echo "rainmill-location ${GITHUB_REF_NAME#v} is already on crates.io"
            echo "held=true" >> "$GITHUB_OUTPUT"
          else
            echo "held=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.held.outputs.held == 'false'
        id: auth
      - name: Publish
        if: steps.held.outputs.held == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from the CHANGELOG section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md | sed '/./,$!d' > notes.md
          test -s notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "The release for $GITHUB_REF_NAME already exists."
            exit 0
          fi
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "rainmill-location ${GITHUB_REF_NAME#v}" --notes-file notes.md "${flags[@]}"
